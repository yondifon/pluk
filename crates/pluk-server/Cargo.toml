[package]
name = "pluk-server"
description = "MCP serving, HTTP routes, and SSE for Pluk"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pluk-serverd"
path = "src/bin/pluk-serverd.rs"

[dependencies]
pluk-adapters = { path = "../pluk-adapters" }
pluk-core = { path = "../pluk-core" }
pluk-store = { path = "../pluk-store" }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
futures = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-util = "0.7"
