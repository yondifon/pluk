[package]
name = "pluk-db"
description = "Database driver abstraction for Pluk — Postgres, MySQL, MSSQL, and SQLite engines"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pluk-policy = { path = "../pluk-policy" }
pluk-core = { path = "../pluk-core" }
pluk-ssh = { path = "../pluk-ssh" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"

# Postgres
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
uuid = { version = "1", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
rustls-pemfile = { version = "2", optional = true }

# SQLite
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

# MySQL
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "tls-rustls"], optional = true }

# Microsoft SQL Server
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "tokio"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
test-support = []
default = ["postgres", "mysql", "mssql"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:rustls-pemfile", "dep:chrono", "dep:uuid"]
mysql = ["dep:sqlx"]
mssql = ["dep:tiberius", "dep:futures-util"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
