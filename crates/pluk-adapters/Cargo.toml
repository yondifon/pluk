[package]
name = "pluk-adapters"
description = "Adapter framework and service adapters for Pluk"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pluk-browser = { path = "../pluk-browser" }
pluk-store = { path = "../pluk-store" }
pluk-policy = { path = "../pluk-policy" }
pluk-db = { path = "../pluk-db" }
pluk-ssh = { path = "../pluk-ssh" }
pluk-core = { path = "../pluk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Client half of rmcp: Pluk is the MCP client when it proxies a third-party
# server. `auth` carries the OAuth flow those servers ask for, and
# `transport-child-process` runs a local server over stdio.
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "client-side-sse", "auth", "reqwest", "transport-child-process"] }
# rmcp spawns a local server through process-wrap without re-exporting it.
# The server leads its own process group, so stopping it also stops the
# `node` or `python` that `npx`, `bunx` or `uvx` start under it.
process-wrap = { version = "9", default-features = false, features = ["tokio1", "process-group"] }
# rmcp builds its HTTP transport on reqwest 0.13, one major ahead of the
# client the API adapters share, so the MCP proxy names that one directly.
# The `reqwest` feature above is what puts rustls behind it.
upstream_http = { package = "reqwest", version = "0.13", default-features = false }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
# tokio-rustls-comp pulls in tls-rustls: without it `rediss://` cannot connect,
# which locks out every managed provider. Reuses the rustls stack reqwest and
# sqlx already build.
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
# rustls plus the SRV resolver `mongodb+srv://` needs; `openssl-tls` stays off
# so no build here pulls in OpenSSL. bson 3 rather than the default bson 2,
# which forces `serde_json/preserve_order` on the whole workspace and would
# reorder every JSON object Pluk already emits.
mongodb = { version = "3", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3", features = ["serde_json-1"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# The proxy client's tests talk to a real MCP server on a loopback port.
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
