[package]
name = "pluk-adapters"
description = "Adapter framework and service adapters for Pluk"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pluk-store = { path = "../pluk-store" }
pluk-policy = { path = "../pluk-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
